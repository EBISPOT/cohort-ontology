id: coho
title: "Cohort Ontology"
github_org: EBISPOT
repo: cohort-ontology
git_main_branch: main
release_artefacts: 
  - base
  - full
  - simple
primary_release: full
export_formats:
  - owl
  - obo
  - json
import_group:
  annotation_properties:
    - rdfs:label
    - IAO:0000115
    - oboInOwl:is_metadata_tag
    - OMO:0002000
    - oboInOwl:SynonymTypeProperty
  products: 
    - id: ro
    - id: omo
      module_type: mirror
robot_java_args: '-Xmx8G'
documentation:
  documentation_system: mkdocs
subset_group:
  products:
    - id: GWAS
    - id: MetaboLight
    - id: EGA
    - id: PRIDE
components:
  products:
    - filename: GWAS.owl
      use_template: True
      templates:
        - GWAS.csv
    - filename: MetaboLight.owl
      use_template: True
      templates:
        - MetaboLight.csv
    - filename: EGA.owl
      use_template: True
      templates:
        - EGA.csv
    - filename: PRIDE.owl
      use_template: True
      templates:
        - PRIDE.csv