id: coho
title: "Cohort Ontology"
github_org: EBISPOT
repo: cohort-ontology
git_main_branch: main
release_artefacts: 
  - base
  - full
  - simple
primary_release: full
export_formats:
  - owl
  - obo
  - json
import_group:
  annotation_properties:
    - rdfs:label
    - IAO:0000115
    - oboInOwl:is_metadata_tag
    - OMO:0002000
    - oboInOwl:SynonymTypeProperty
  products: 
    - id: ro
    - id: omo
      module_type: mirror
robot_java_args: '-Xmx8G'
documentation:
  documentation_system: mkdocs
robot_report:
  release_reports: False
  fail_on : ERROR
  use_labels : False
  custom_profile : False
  use_base_iris: True
  sparql_test_on:
    - edit
    - coho-full.owl
  custom_sparql_checks :
    - synonym-as-label