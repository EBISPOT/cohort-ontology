id: coho
title: "Cohort Ontology"
github_org: EBISPOT
repo: cohort-ontology
uribase: "http://www.ebi.ac.uk"
git_main_branch: main
release_artefacts: 
  - base
  - full
  - simple
primary_release: full
export_formats:
  - owl
  - obo
  - json
import_group:
  annotation_properties:
    - rdfs:label
    - IAO:0000115
    - oboInOwl:is_metadata_tag
    - OMO:0002000
    - oboInOwl:SynonymTypeProperty
  products: 
    - id: ro
    - id: omo
      module_type: mirror
    - id: NCIT
robot_java_args: '-Xmx8G'
documentation:
  documentation_system: mkdocs
subset_group:
  products:
    - id: GWAS
    - id: MetaboLight
    - id: EGA
    - id: PRIDE
components:
  products:
    - filename: gaz_xrefs.owl
      use_template: True
      template_options: '--prefix "dbpedia: http://dbpedia.org/resource/" --prefix "oio: http://www.geneontology.org/formats/oboInOwl#"'
      templates:
        - gaz_xrefs.tsv
    - filename: GWAS.owl
      use_template: True
      templates:
        - GWAS.csv
    - filename: MetaboLight.owl
      use_template: True
      templates:
        - MetaboLight.csv
    - filename: EGA.owl
      use_template: True
      templates:
        - EGA.csv
    - filename: PRIDE.owl
      use_template: True
      templates:
        - PRIDE.csv
robot_report:
  release_reports: False
  fail_on : ERROR
  use_labels : False
  custom_profile : False
  use_base_iris: True
  sparql_test_on:
    - edit
    - coho-full.owl
  custom_sparql_checks :
    - synonym-as-label
    - owldef-self-reference
    - iri-range
    - label-with-iri
    - multiple-replaced_by
    - dc-properties
