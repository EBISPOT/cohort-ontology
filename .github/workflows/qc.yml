# Basic owlmake workflow

name: CI

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "ontology_qc"
  ontology_qc:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    env:
      OWLMAKE_VERSION: v0.3.1

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Install owlmake
        run: |
          base=https://github.com/EBISPOT/owlmake/releases/download/$OWLMAKE_VERSION
          curl -fsSL -O $base/om-linux-amd64 -O $base/om-linux-amd64.sha256
          sha256sum -c om-linux-amd64.sha256
          sudo install -m 755 om-linux-amd64 /usr/local/bin/om
          rm om-linux-amd64 om-linux-amd64.sha256

      - name: Run ontology QC checks
        env:
          DEFAULT_BRANCH: main
        run: om make test IMP=false PAT=false MIR=false
