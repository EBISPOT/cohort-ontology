site_name: Cohort Ontology
theme:
  name: material
  features:
    - content.tabs.link
plugins:
  - search
markdown_extensions:
  - pymdownx.highlight:
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde

site_url: https://EBISPOT.github.io/cohort-ontology/
repo_url: https://github.com/EBISPOT/cohort-ontology/

nav:
  - Getting started: index.md
  - Cite: cite.md
  - How-to guides:
      - Workflows:
          - Overview: workflows/index.md
          - Editors Workflow: workflows/EditorsWorkflow.md
          - Release Workflow: workflows/ReleaseWorkflow.md
          - Build configuration: workflows/BuildConfiguration.md
          - Imports management: workflows/UpdateImports.md
          - Components management: workflows/components.md
          - Quality control and Continuous Integration: workflows/QualityControl.md
          - Managing the documentation: workflows/ManageDocumentation.md
          - Repository overview: workflows/RepositoryFileStructure.md
      - Contributing: contributing.md

