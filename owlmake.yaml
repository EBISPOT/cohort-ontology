min_owlmake_version: 0.3.2
emulate_odk_version: 1.6.1
id: coho
title: Cohort Ontology
github_org: EBISPOT
repo: cohort-ontology
uribase: http://www.ebi.ac.uk
namespaces:
- http://www.ebi.ac.uk/coho/
- http://www.ebi.ac.uk/coho#
git_main_branch: main
create_obo_metadata: false
release_artefacts:
- base
- full
- simple
primary_release: full
reasoner: hermit
release_property_assertions:
- coho:hasSubCohort
- coho:isSubCohortOf
- coho:hasCohort
- coho:has_data_collection_location
export_formats:
- owl
- obo
- json
import_group:
  annotation_properties:
  - rdfs:label
  - IAO:0000115
  - oboInOwl:is_metadata_tag
  - OMO:0002000
  - oboInOwl:SynonymTypeProperty
  products:
  - id: ro
  - id: omo
    module_type: mirror
  - id: NCIT
documentation:
  documentation_system: mkdocs
components:
  products:
  - filename: gaz_xrefs.owl
    use_template: true
    template_options: '--prefix "COHO: http://www.ebi.ac.uk/coho/COHO_" --prefix "dbpedia: http://dbpedia.org/resource/" --prefix "RO: http://purl.obolibrary.org/obo/RO_" --prefix "oio: http://www.geneontology.org/formats/oboInOwl#"'
    templates:
    - gaz_xrefs.tsv
  - filename: GWAS.owl
    use_template: true
    template_options: '--prefix "COHO: http://www.ebi.ac.uk/coho/COHO_" --prefix "dbpedia: http://dbpedia.org/resource/" --prefix "RO: http://purl.obolibrary.org/obo/RO_" --prefix "oio: http://www.geneontology.org/formats/oboInOwl#"'
    templates:
    - GWAS.csv
  - filename: PGS.owl
    use_template: true
    template_options: '--prefix "COHO: http://www.ebi.ac.uk/coho/COHO_" --prefix "dbpedia: http://dbpedia.org/resource/" --prefix "RO: http://purl.obolibrary.org/obo/RO_" --prefix "oio: http://www.geneontology.org/formats/oboInOwl#"'
    templates:
    - PGS.csv
  - filename: MetaboLight.owl
    use_template: true
    template_options: '--prefix "COHO: http://www.ebi.ac.uk/coho/COHO_" --prefix "dbpedia: http://dbpedia.org/resource/" --prefix "RO: http://purl.obolibrary.org/obo/RO_" --prefix "oio: http://www.geneontology.org/formats/oboInOwl#"'
    templates:
    - MetaboLight.csv
  - filename: EGA.owl
    use_template: true
    template_options: '--prefix "COHO: http://www.ebi.ac.uk/coho/COHO_" --prefix "dbpedia: http://dbpedia.org/resource/" --prefix "RO: http://purl.obolibrary.org/obo/RO_" --prefix "oio: http://www.geneontology.org/formats/oboInOwl#"'
    templates:
    - EGA.csv
  - filename: PRIDE.owl
    use_template: true
    template_options: '--prefix "COHO: http://www.ebi.ac.uk/coho/COHO_" --prefix "dbpedia: http://dbpedia.org/resource/" --prefix "RO: http://purl.obolibrary.org/obo/RO_" --prefix "oio: http://www.geneontology.org/formats/oboInOwl#"'
    templates:
    - PRIDE.csv
  - filename: locations.owl
    use_template: true
    template_options: '--prefix "COHO: http://www.ebi.ac.uk/coho/COHO_" --prefix "dbpedia: http://dbpedia.org/resource/" --prefix "RO: http://purl.obolibrary.org/obo/RO_" --prefix "oio: http://www.geneontology.org/formats/oboInOwl#" --prefix "coho: http://www.ebi.ac.uk/coho/"'
    templates:
    - locations.tsv
  - filename: aggregation_members.owl
    use_template: true
    template_options: '--prefix "COHO: http://www.ebi.ac.uk/coho/COHO_" --prefix "dbpedia: http://dbpedia.org/resource/" --prefix "RO: http://purl.obolibrary.org/obo/RO_" --prefix "oio: http://www.geneontology.org/formats/oboInOwl#" --prefix "coho: http://www.ebi.ac.uk/coho/"'
    templates:
    - aggregation_members.tsv
  - filename: definitions.owl
    use_template: true
    template_options: '--prefix "COHO: http://www.ebi.ac.uk/coho/COHO_" --prefix "dbpedia: http://dbpedia.org/resource/" --prefix "RO: http://purl.obolibrary.org/obo/RO_" --prefix "oio: http://www.geneontology.org/formats/oboInOwl#" --prefix "dcterms: http://purl.org/dc/terms/"'
    templates:
    - definitions.tsv
  - filename: example_studies.owl
    use_template: true
    template_options: '--prefix "COHO: http://www.ebi.ac.uk/coho/COHO_" --prefix "dbpedia: http://dbpedia.org/resource/" --prefix "RO: http://purl.obolibrary.org/obo/RO_" --prefix "oio: http://www.geneontology.org/formats/oboInOwl#" --prefix "dcterms: http://purl.org/dc/terms/"'
    templates:
    - example_studies.tsv
report:
  release_reports: false
  fail_on: ERROR
  use_labels: false
  custom_profile: true
  use_base_iris: true
  sparql_test_on:
  - edit
  - coho-full.owl
  custom_sparql_checks:
  - synonym-as-label
  - owldef-self-reference
  - iri-range
  - label-with-iri
  - multiple-replaced_by
  - dc-properties
  - missing-usage-example
  - missing-definition
  - overlapping-synonyms
  - subset-example
targets:
- target: docs/images/cohort-map.svg
  needs:
  - src/templates/locations.tsv
  - src/templates/gaz_xrefs.tsv
  - src/map/countries-110m.json
  - src/scripts/cohort_map.py
  steps:
  - op: shell
    command: python3 ../scripts/cohort_map.py
    requires:
    - python3
- target: src/ontology/tmp/coho-cohorts.nt
  input: src/ontology/coho-edit.owl
  needs:
  - src/ontology/coho-edit.owl
  - all_components
  steps:
  - op: merge
- target: coho-cohorts.csv
  needs:
  - src/ontology/tmp/coho-cohorts.nt
  - src/templates/definitions.tsv
  - src/scripts/cohort_table.py
  steps:
  - op: shell
    command: python3 ../scripts/cohort_table.py
    requires:
    - python3
- target: prepare_release
  extends: true
  needs:
  - docs/images/cohort-map.svg
  - coho-cohorts.csv
